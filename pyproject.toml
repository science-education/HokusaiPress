[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hokusai-press"
version = "0.0.1"
description = "Scan PDF to clean, light, searchable e-book PDF (non-destructive, batch-first, with a review queue)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy",
    "opencv-python",
    "pypdfium2",
    "pikepdf",
    "Pillow",
    "reportlab",
    # Lossless generic-region JBIG2 encoder. Pin the reviewed release so a
    # normal installation can use JBIG2 without a separate optional extra.
    "pyjbig2 @ git+https://github.com/science-education/pyjbig2.git@v0.1.0",
]

[project.optional-dependencies]
# OCR + searchable-PDF assembly engine (detector is CC BY-NC-SA 4.0 -> output
# is non-commercial; see README).
ocr = ["hybrid-ocr[pdf] @ git+https://github.com/science-education/Yomitoku_NDL-OCR-Lite.git"]
# Complete Mac setup: hybrid-ocr + PyTorch for MPS (GPU) acceleration
mac-ocr = ["hybrid-ocr[pdf] @ git+https://github.com/science-education/Yomitoku_NDL-OCR-Lite.git", "torch", "torchvision"]
# PaddleOCR engines are optional because their runtime and accelerator wheels
# vary by hardware. PaddleOCR-VL needs the doc-parser extra.
paddle = ["paddleocr>=3.7.0", "paddlex[ocr]>=3.7.0"]
paddle-structure = ["paddlepaddle"]
# CTC digit recognizer for folio/page-number detection (nombre_reader.py).
nombre = ["onnxruntime"]
# Backward-compatible alias. pyjbig2 is now installed by default.
jbig2 = []
# Review web UI.
web = ["fastapi", "uvicorn", "pydantic"]
dev = ["pytest"]

[project.scripts]
hokusai-press = "hokusai_press.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hokusai_press"]

[tool.hatch.metadata]
allow-direct-references = true
